# 打标签 v* 时的一条完整发布流水线：
#   版本号校验 → 构建 → 测试 → GitHub Release → 推 nuget.org
# 推 NuGet 是最后一步且不可撤回，此前任何一步（尤其测试）失败都不会发包。
# workflow_dispatch 手动触发仅做构建+测试演练，不创建 Release、不发包；
# 需要重发某个版本时，在对应 tag 的运行记录上 Re-run 即可（推送带 --skip-duplicate，幂等）。
name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write    # 创建 GitHub Release
  id-token: write    # OIDC Trusted Publishing 换取 nuget.org 短时 API key

jobs:
  # 测试矩阵：所有 OS×TFM 组合通过后才允许发布
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            frameworks: "net8.0 net10.0"
          - os: windows-latest
            frameworks: "net48"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Build
        run: dotnet build StreamFrame.slnx -c Release

      - name: Test (${{ matrix.frameworks }})
        shell: bash
        env:
          FRAMEWORKS: ${{ matrix.frameworks }}
        run: |
          for fw in $FRAMEWORKS; do
            dotnet test StreamFrame.slnx -c Release --no-build -f $fw
          done

  release:
    needs: test
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Verify tag matches csproj versions
        run: |
          version="${GITHUB_REF_NAME#v}"
          for proj in src/StreamFrame/StreamFrame.csproj src/StreamFrame.Protocols.Xml/StreamFrame.Protocols.Xml.csproj; do
            csproj_version=$(grep -oPm1 '(?<=<Version>)[^<]+' "$proj")
            if [ "$csproj_version" != "$version" ]; then
              echo "::error::$proj 的 <Version>=$csproj_version 与 tag v$version 不一致，请先同步版本号再打 tag。"
              exit 1
            fi
          done

      - name: Build
        run: dotnet build StreamFrame.slnx -c Release

      # 测试由上方 test 矩阵 job 把关（含 Windows net48）；此处直接打包发布

      - name: Pack
        run: |
          dotnet pack src/StreamFrame/StreamFrame.csproj -c Release --no-build -o artifacts
          dotnet pack src/StreamFrame.Protocols.Xml/StreamFrame.Protocols.Xml.csproj -c Release --no-build -o artifacts

      # ---------- 以下步骤仅在 tag 推送时执行 ----------

      - name: Extract changelog section for this version
        id: notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          # 用 index() 固定字符串匹配版本头，避开正则转义；遇到下一个 "## [" 停止。
          awk -v header="## [$version]" '
            found == 0 && index($0, header) == 1 { found = 1; next }
            found == 1 && index($0, "## [") == 1 { exit }
            found == 1 { print }
          ' CHANGELOG.md > release-notes.md
          if [ -s release-notes.md ]; then
            echo "has_notes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_notes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create Release (from CHANGELOG)
        if: steps.notes.outputs.has_notes == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: release-notes.md
          files: |
            artifacts/*.nupkg
            artifacts/*.snupkg

      - name: Create Release (auto-generated notes)
        if: steps.notes.outputs.has_notes != 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            artifacts/*.nupkg
            artifacts/*.snupkg

      - name: Check NUGET_USER variable
        run: |
          if [ -z "${NUGET_USER}" ]; then
            echo "::error::NUGET_USER 为空。Settings → Secrets and variables → Actions → Variables 添加 NUGET_USER（nuget.org 用户名，注意是 Variables 不是 Secrets）。"
            exit 1
          fi
        env:
          NUGET_USER: ${{ vars.NUGET_USER }}

      - name: NuGet Login (OIDC)
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Push to nuget.org
        run: |
          dotnet nuget push "artifacts/*.nupkg" \
            --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" \
            --source https://www.nuget.org/api/v2/package \
            --skip-duplicate
