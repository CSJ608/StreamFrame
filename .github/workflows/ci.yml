# 日常 push / PR 的构建与测试门禁；发布流水线见 release.yml。
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          # 现代 .NET 在 linux 跑；net48（验证 netstandard2.0 资产）需要 Windows 运行时
          - os: ubuntu-latest
            frameworks: "net8.0 net10.0"
          - os: windows-latest
            frameworks: "net48"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Build
        run: dotnet build StreamFrame.slnx -c Release

      - name: Test (${{ matrix.frameworks }})
        shell: bash
        env:
          FRAMEWORKS: ${{ matrix.frameworks }}
        run: |
          for fw in $FRAMEWORKS; do
            dotnet test StreamFrame.slnx -c Release --no-build -f $fw
          done
