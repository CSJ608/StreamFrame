name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            frameworks: "net8.0 net10.0"
          - os: windows-latest
            frameworks: "net48"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          dotnet-version: 8.0.x

      - name: Restore locked dependencies
        run: dotnet restore StreamFrame.slnx --locked-mode -p:AuditPipeline=true

      - name: Build
        run: dotnet build StreamFrame.slnx -c Release --no-restore

      - name: Test (${{ matrix.frameworks }})
        shell: bash
        env:
          FRAMEWORKS: ${{ matrix.frameworks }}
        run: |
          for fw in $FRAMEWORKS; do
            dotnet test StreamFrame.slnx -c Release --no-build -f "$fw" --logger trx --results-directory "TestResults/$fw"
          done

      # 保留矩阵值及必需检查名，额外验证 Windows 上的现代运行时。
      - name: Test modern .NET on Windows
        if: runner.os == 'Windows'
        shell: bash
        run: |
          for fw in net8.0 net10.0; do
            dotnet test StreamFrame.slnx -c Release --no-build -f "$fw" --logger trx --results-directory "TestResults/$fw"
          done

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tests-${{ matrix.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: TestResults/
          retention-days: 14

  security-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          dotnet-version: 8.0.x
      - name: Test audit validation
        run: python3 -m unittest discover -s build -p 'test_*.py'
      - name: Restore and audit all projects
        run: dotnet restore StreamFrame.slnx --locked-mode --force -p:AuditPipeline=true
      - name: Cross-check advisory databases
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 build/security-audit.py

  coverage:
    runs-on: ubuntu-latest
    env:
      EnableCoverage: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          dotnet-version: 8.0.x
      - name: Restore isolated coverage dependencies
        run: dotnet restore StreamFrame.slnx --locked-mode -p:AuditPipeline=true
      - name: Build coverage tests
        run: dotnet build test/StreamFrame.Tests/StreamFrame.Tests.csproj -c Release --no-restore
      - name: Collect coverage
        shell: bash
        run: |
          for fw in net8.0 net10.0; do
            dotnet test test/StreamFrame.Tests/StreamFrame.Tests.csproj -c Release --no-build -f "$fw" \
              --collect:"XPlat Code Coverage" --results-directory "coverage/$fw"
          done
      - name: Verify and summarize coverage
        run: python3 build/coverage-summary.py
      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-${{ github.run_id }}-${{ github.run_attempt }}
          path: coverage/
          retention-days: 14
      # 隔离不等于修复；内嵌组件的高危告警仍使该作业失败，不自动豁免。
      - name: Audit embedded coverage components
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 build/security-audit.py --coverage

  aot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Restore NativeAOT dependencies
        run: dotnet restore samples/StreamFrame.AotSmoke --locked-mode -p:AuditPipeline=true
      - name: Publish NativeAOT
        run: dotnet publish samples/StreamFrame.AotSmoke -c Release -r linux-x64 --no-restore -o artifacts/aot
      - name: Run NativeAOT smoke
        run: timeout 40s ./artifacts/aot/StreamFrame.AotSmoke
      - name: Verify NativeAOT failure exit codes
        shell: bash
        run: |
          set -euo pipefail
          for fault in connect missing consumer content; do
            category="$fault"
            case "$fault" in
              connect) category=connection ;;
              missing) category=messages ;;
            esac
            status=0
            timeout 40s ./artifacts/aot/StreamFrame.AotSmoke "--fault=$fault" > "$fault.log" 2>&1 || status=$?
            cat "$fault.log"
            if [ "$status" -ne 1 ] || ! grep -Fq "AOT smoke FAILED [$category]:" "$fault.log"; then
              echo "::error::Fault $fault was not detected correctly (exit=$status)"
              exit 1
            fi
            echo "Verified expected failure: $fault (exit=$status)" | tee -a "$GITHUB_STEP_SUMMARY"
          done
