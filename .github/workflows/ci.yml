# 日常 push / PR 的构建与测试门禁；发布流水线见 release.yml。
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "8.0.x"

      - name: Build
        run: dotnet build StreamFrame.slnx -c Release

      - name: Test
        run: dotnet test StreamFrame.slnx -c Release --no-build
